<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="primefaces">

<h:head>
    <meta charset="UTF-8"/>
    <title>Simple Facelet Page</title>
</h:head>


<h:body>

    <h:form id="form">

        <p:messages showDetail="true"/>
        <p:panel header="I am the header, Student Registration">


            <p:outputLabel for="fullName" value="Full Name"/>
            <p:inputText id="fullName" value="#{studentFormBean.studentInfo.fullName}" required="true"
                         requiredMessage="Full Name is Required"/>

            <br/>

            <p:outputLabel for="program" value="Program"/>
            <p:selectOneMenu id="program" value="#{studentFormBean.studentInfo.program}" required="true"
                             requiredMessage="Program is Required">

                <f:selectItem itemLabel="Select Program" itemValue="" noSelectionOption="true"/>
                <f:selectItem itemLabel="Digital Media" itemValue="DMIT"/>
                <f:selectItem itemLabel="Software Development" itemValue="SDEV"/>

            </p:selectOneMenu>

            <br/>

            <p:selectBooleanCheckbox id="fullTime" value="#{studentFormBean.studentInfo.fullTime}"/>

            <p:outputLabel for="fullTime" value="Full Time Student?"/>

            <br/>

            <p:commandButton value="submit" action="#{studentFormBean.onSubmit()}" update="@form" process="form"/>

            <h:outputText value="Successful Submission: #{studentFormBean.submissionCount}"/>


        </p:panel>



        <p:dataTable id="studentsDataTable" value="#{studentListSession.stud    ents}" var="currentStudent">

            <p:column headerText="Full Name">
                <h:outputText value="#{currentStudent.fullName}"/>
            </p:column>

            <p:column headerText="Program">
                <h:outputText value="#{currentStudent.program}"/>
            </p:column>

            <p:column headerText="Full Time">
                <h:selectBooleanCheckbox value="#{currentStudent.fullTime}" disabled="true"/>
            </p:column>

            <p:column headerText="Action">
                <p:commandButton value="Remove" action="#{studentListSession.remove(currentStudent)}" update="studentsDataTable" process="@this"/>
            </p:column>

        </p:dataTable>

    </h:form>

</h:body>
</html>

<!DOCTYPE html>
<html xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns="http://www.w3.org/1999/xhtml">

<h:body>
    <meta charset="UTF-8"/>
    <title>Simple Facelet Page</title>
</h:body>


<h:body>

    <h:form id="form">

        <p:messages showDetail="true"/>
        <p:panel header="I am the header, Student Registration">


            <p:outputLabel for="fullName" value="Full Name"/>
            <p:inputText id="fullName" value="#{studentFormBean.fullName}" required="true"
                         requiredMessage="Full Name is Required"/>

            <br/>

            <p:outputLabel for="program" value="Program"/>
            <p:selectOneMenu id="program" value="#{studentFormBean.program}" required="true"
                             requiredMessage="Program is Required">

                <f:selectItem itemLabel="Select Program" itemValue="" noSelectionOption="true"/>
                <f:selectItem itemLabel="Digital Media" itemValue="DMIT"/>
                <f:selectItem itemLabel="Software Development" itemValue="SDEV"/>

            </p:selectOneMenu>

            <br/>

            <p:selectBooleanCheckbox id="fullTime" value="#{studentFormBean.fullTime}"/>

            <p:outputLabel for="fullTime" value="Full Time Student?"/>

            <br/>

            <p:commandButton value="submit" action="#{studentFormBean.onSubmit()}" update="@form" process="@form"/>

            <h:outputText value="Successful Submission: #{studentFormBean.submissionCount}"/>


        </p:panel>

    </h:form>

</h:body>
</html>
